name: Deploy

on:
  push:
    branches:
      - main
  # Daily, so concerts move from upcoming to past without an edit.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.168.0"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://website.uppsalablasarsymfoniker.workers.dev

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Erlang and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"

      - name: Download dependencies
        run: gleam deps download

      - name: Test
        run: gleam test

      - name: Build the site
        run: gleam run build
        env:
          SITE_URL: https://website.uppsalablasarsymfoniker.workers.dev
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN }}

      # Installing wrangler is most of the deploy's time. The action skips the
      # install when it finds this exact version in node_modules.
      - name: Restore wrangler
        uses: actions/cache@v6
        with:
          path: node_modules
          key: wrangler-${{ env.WRANGLER_VERSION }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy
